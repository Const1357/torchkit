[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "torchkit"
version = "0.1.0"
requires-python = ">=3.12"

# Add runtime deps that your package imports at import-time.
dependencies = [
  "numpy",
  "scikit-learn",
  "torch",
  "optuna",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
optuna = ["optuna"]
test = ["pytest"]
dev = ["pytest", "ruff", "build", "twine"]
